<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>AmrPotli team</title>
  <meta name="theme-color" content="#0f766e" />
  <link rel="icon" href="../AmrPotli/icons/icon.svg" type="image/svg+xml" />
  <script>
    try {
      const th = localStorage.getItem('mt:theme');
      if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th;
    } catch {}
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- signed out -->
  <main id="gate" class="gate" hidden>
    <div class="gate-card">
      <img src="../AmrPotli/icons/icon.svg" alt="" width="56" height="56" />
      <h1>AmrPotli team</h1>
      <p class="muted">The company dashboard: team, app users, leads, feedback, limits, promo codes, marketing and notices.</p>
      <button class="btn primary wide" id="signin">Sign in with Google</button>
      <p class="error" id="gate-error" hidden></p>
      <p class="muted small">Only people added to the team can open it. Users' money records are never here: they stay in each user's own Google Drive.</p>
    </div>
  </main>

  <!-- signed in -->
  <div id="shell" class="shell" hidden>
    <aside class="side" id="side">
      <div class="brand"><img src="../AmrPotli/icons/icon.svg" alt="" width="32" height="32" /><div><b>AmrPotli</b><small>Team dashboard</small></div></div>
      <div class="me" id="me"></div>
      <nav id="nav"></nav>
      <div class="side-foot">
        <button class="round" id="theme" title="Day or night"></button>
        <button class="btn sm" id="signout"></button>
      </div>
    </aside>
    <header class="topbar">
      <button class="round" id="menu" aria-label="Menu"></button>
      <b id="top-title"></b>
    </header>
    <main class="main" id="main"></main>
  </div>

  <dialog id="dlg" class="dlg"><form method="dialog" id="dlg-form"></form></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
