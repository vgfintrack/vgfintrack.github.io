<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>FinnBlu team</title>
  <meta name="theme-color" content="#0E2B49" />
  <link rel="icon" href="../FinnBlu/icons/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@500;600;700&amp;family=Hind+Siliguri:wght@400;500;600;700&amp;display=swap" />
  <script>
    try {
      const th = localStorage.getItem('mt:theme');
      if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th;
    } catch {}
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- signed out -->
  <main id="gate" class="gate" hidden>
    <div class="gate-card">
      <h1 class="gate-logo"><img class="lockup" src="../assets/brand/finnblu-lockup-primary.svg" alt="FinnBlu" width="216" height="56" /></h1>
      <p class="muted" style="margin-top:-6px">Team dashboard</p>
      <p class="muted">The company dashboard: team, app users, leads, feedback, limits, promo codes, marketing and notices.</p>
      <button class="btn primary wide" id="signin">Sign in with Google</button>
      <p class="error" id="gate-error" hidden></p>
      <p class="muted small">Only people added to the team can open it. Users' money records are never here: they stay in each user's own Google Drive.</p>
    </div>
  </main>

  <!-- signed in -->
  <div id="shell" class="shell" hidden>
    <aside class="side" id="side">
      <div class="brand"><img class="lockup" src="../assets/brand/finnblu-lockup-primary.svg" alt="FinnBlu" width="123" height="32" /><small>Team dashboard</small></div>
      <div class="me" id="me"></div>
      <nav id="nav"></nav>
      <div class="side-foot">
        <button class="round" id="theme" title="Day or night"></button>
        <button class="btn sm" id="signout"></button>
      </div>
    </aside>
    <header class="topbar">
      <button class="round" id="menu" aria-label="Menu"></button>
      <b id="top-title"></b>
    </header>
    <main class="main" id="main"></main>
  </div>

  <dialog id="dlg" class="dlg"><form method="dialog" id="dlg-form"></form></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
